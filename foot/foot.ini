# ~/.config/foot/foot.ini

[main]
font=JetBrainsMono Nerd Font:size=11  # Fonte sugerida para o tema
pad=12x12                             # Margem interna confortável

[colors-dark]
alpha=0.90                            # Transparência mantida em 90%
# Paleta oficial Tokyo Night (Dark/Storm)
background=FFFFFF                     # Fundo escuro azulado característico
foreground=000000                     # Texto principal claro e nítido

## Paleta de Cores ANSI
regular0=15161e  # Black
regular1=f7768e  # Red
regular2=9ece6a  # Green
regular3=e0af68  # Yellow
regular4=7aa2f7  # Blue
regular5=bb9af7  # Magenta
regular6=7dcfff  # Cyan
regular7=a9b1d6  # White

bright0=414868   # Bright Black (Comentários)
bright1=f7768e   # Bright Red
bright2=9ece6a   # Bright Green
bright3=e0af68   # Bright Yellow
bright4=7aa2f7   # Bright Blue
bright5=bb9af7   # Bright Magenta
bright6=7dcfff   # Bright Cyan
bright7=c0caf5   # Bright White
